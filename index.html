<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inqi</title>
  <meta name="description" content="Personal website of Inqi, under construction.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Inqi</h1>
      <p>This site is under construction.</p>
    </header>

    <section class="launch" aria-label="Launch">
      <!-- Without JavaScript only this line shows. Set the launch moment in datetime. -->
      <p id="launch-text">Launching <time id="launch" datetime="2026-11-09T00:00:00+01:00">9 November 2026</time>.</p>

      <dl class="timer" id="timer" role="timer" aria-label="Time remaining until launch" hidden>
        <div><dt>days</dt><dd data-unit="days">00</dd></div>
        <div><dt>hours</dt><dd data-unit="hours">00</dd></div>
        <div><dt>minutes</dt><dd data-unit="minutes">00</dd></div>
        <div><dt>seconds</dt><dd data-unit="seconds">00</dd></div>
      </dl>
    </section>

    <p>Get in touch: <a href="mailto:work@inqi.me">work@inqi.me</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
